<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LabShot Download</title>
  <style>
    :root {
      --bg: #0d1324;
      --card: rgba(255,255,255,.10);
      --text: #f8fafc;
      --muted: #b7c0d8;
      --accent: #7dd3fc;
      --accent2: #bbf7d0;
      --line: rgba(255,255,255,.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(125,211,252,.28), transparent 24rem),
        radial-gradient(circle at 85% 20%, rgba(187,247,208,.18), transparent 22rem),
        linear-gradient(135deg, #0d1324, #151a32 55%, #0f172a);
    }
    .card {
      width: min(460px, 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 20px;
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,.06));
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.05em; }
    p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; }
    .loader {
      width: 48px;
      height: 48px;
      margin: 20px auto;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,.18);
      border-top-color: var(--accent);
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    img {
      width: 100%;
      border-radius: 18px;
      display: block;
      background: white;
      margin: 16px 0;
    }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      color: #08111f;
      display: inline-flex;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }
    .hidden { display: none !important; }
    small { color: var(--muted); display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>LabShot</h1>
    <p id="status">Foto sedang disiapkan. Tunggu sebentar...</p>
    <div id="loader" class="loader"></div>
    <img id="photo" class="hidden" alt="Hasil LabShot" />
    <a id="downloadBtn" class="btn hidden" href="#" download="labshot-story.jpg">Download Foto</a>
    <small id="note">Halaman ini akan otomatis menampilkan foto setelah upload selesai.</small>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getStorage,
      ref,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1XMqV1-_Muy8gDcpPJwGEgJW_Wk1Vvoc",
      authDomain: "labshot-photobox.firebaseapp.com",
      projectId: "labshot-photobox",
      storageBucket: "labshot-photobox.firebasestorage.app",
      messagingSenderId: "727756970252",
      appId: "1:727756970252:web:9d3bb740e00cdf4b92d129"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    const params = new URLSearchParams(location.search);
    const path = params.get("path");

    const statusEl = document.getElementById("status");
    const loaderEl = document.getElementById("loader");
    const photoEl = document.getElementById("photo");
    const downloadBtn = document.getElementById("downloadBtn");
    const noteEl = document.getElementById("note");

    if (!path) {
      statusEl.textContent = "Link foto tidak valid.";
      loaderEl.classList.add("hidden");
      noteEl.textContent = "Silakan scan ulang QR dari aplikasi LabShot.";
    } else {
      waitForPhoto(path);
    }

    async function waitForPhoto(storagePath) {
      const photoRef = ref(storage, storagePath);
      const maxTry = 80;

      for (let i = 1; i <= maxTry; i++) {
        try {
          const url = await getDownloadURL(photoRef);

          photoEl.src = url;
          photoEl.classList.remove("hidden");

          downloadBtn.href = url;
          downloadBtn.classList.remove("hidden");

          loaderEl.classList.add("hidden");
          statusEl.textContent = "Foto sudah siap.";
          noteEl.textContent = "Tekan dan tahan gambar untuk menyimpan, atau gunakan tombol Download.";
          return;
        } catch (error) {
          statusEl.textContent = `Foto sedang diupload... (${i}/${maxTry})`;
          await new Promise(resolve => setTimeout(resolve, 1200));
        }
      }

      loaderEl.classList.add("hidden");
      statusEl.textContent = "Foto belum tersedia.";
      noteEl.textContent = "Upload terlalu lama atau gagal. Silakan scan ulang atau foto ulang.";
    }
  </script>
</body>
</html>
